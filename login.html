<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper: #EDE4D2;
    --paper-2: #E3D6BC;
    --paper-deep: #D8C8A6;
    --ink: #1F3A5C;
    --ink-light: #345480;
    --brick: #B23B2E;
    --brick-light: #D2543F;
    --mustard: #D9A404;
    --mustard-light: #F0BC2E;
    --charcoal: #2B2620;
    --cream: #FAF6EC;
    --green: #3E8E5A;
    --green-light: #4FAE6E;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    font-family:'Poppins', sans-serif;
    color: var(--charcoal);
    background: var(--paper);
    overflow-x: hidden;
  }

  body{
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    position: relative; padding: 20px;
  }

  body::before {
    content:''; position: fixed; top:0; left:0; right:0; bottom:0;
    background-image:
      linear-gradient(90deg, transparent 79px, #ab4747 79px, #ab4747 81px, transparent 81px),
      linear-gradient(#d3c6ad 1px, transparent 1px);
    background-size: 100% 100%, 100% 28px;
    opacity: 0.35; z-index: -2; pointer-events: none;
  }

  .login-card {
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 6px 8px 0px var(--ink);
    padding: 32px 28px;
    width: 100%; max-width: 420px;
    position: relative; text-align: center;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px; color: var(--brick);
    line-height: 1; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 4px;
    text-shadow: 2px 2px 0px var(--ink);
  }

  .tagline {
    font-family: 'Caveat', cursive;
    font-size: 24px; color: var(--ink-light);
    margin-bottom: 24px; font-weight: 700;
  }

  .input-group {
    margin-bottom: 16px; text-align: left;
  }

  .input-group label {
    display: block; font-size: 13px; font-weight: 700;
    color: var(--ink); margin-bottom: 6px; text-transform: uppercase;
  }

  .input-field {
    width: 100%; padding: 12px 14px;
    border: 2px solid var(--ink); border-radius: 8px;
    font-family: 'Poppins', sans-serif; font-size: 15px;
    background: #FFF; color: var(--charcoal); outline: none;
    transition: border-color 0.2s;
  }

  .input-field:focus { border-color: var(--brick); }

  .actions-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 20px;
  }

  .btn {
    width: 100%; padding: 12px;
    border: 2px solid var(--ink); border-radius: 8px;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all 0.15s ease;
    box-shadow: 3px 3px 0px var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--ink); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-primary { background: var(--mustard); color: var(--ink); }
  .btn-primary:hover { background: var(--mustard-light); }

  .btn-secondary { background: var(--green); color: #FFF; }
  .btn-secondary:hover { background: var(--green-light); }

  .btn-google {
    background: #FFF; color: var(--charcoal);
    margin-top: 12px; border: 2px solid var(--ink);
  }
  .btn-google:hover { background: #F5F5F5; }

  .btn-guest {
    background: transparent; border: none; box-shadow: none;
    color: var(--ink-light); text-decoration: underline; font-size: 13px;
    margin-top: 14px; cursor: pointer; width: auto; display: inline-block;
  }
  .btn-guest:hover { color: var(--brick); }

  .feedback-msg {
    font-size: 13px; font-weight: 700; margin-top: 12px; min-height: 18px;
  }
  .feedback-msg.error { color: var(--brick); }
  .feedback-msg.success { color: var(--green); }

  .modal-overlay {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.6); display: none;
    justify-content: center; align-items: center; z-index: 1000;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--cream); border: 3px solid var(--ink);
    border-radius: 14px; padding: 24px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 5px 5px 0px var(--ink);
  }

  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--brick); margin-bottom: 8px; }
  .modal-desc { font-size: 14px; color: var(--charcoal); margin-bottom: 18px; line-height: 1.4; }
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo">DrawStop</div>
    <div class="tagline">Desenhe, Adivinhe & Pare! ✏️</div>

    <form id="loginForm" onsubmit="return false;">
      <div class="input-group">
        <label for="emailInput">E-mail</label>
        <input type="email" id="emailInput" class="input-field" placeholder="seu@email.com" required>
      </div>

      <div class="input-group">
        <label for="passInput">Senha</label>
        <input type="password" id="passInput" class="input-field" placeholder="••••••••" required minlength="6">
      </div>

      <div class="actions-grid">
        <button type="button" class="btn btn-primary" id="btnEntrar" onclick="handleEmailLogin()">Entrar</button>
        <button type="button" class="btn btn-secondary" id="btnCriar" onclick="handleEmailSignup()">Criar Conta</button>
      </div>

      <button type="button" class="btn btn-google" id="btnGoogle" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Entrar com Google
      </button>

      <div>
        <button type="button" class="btn-guest" onclick="openGuestModal()">Entrar como Visitante</button>
      </div>

      <div class="feedback-msg" id="feedback"></div>
    </form>
  </div>

  <div class="modal-overlay" id="guestModal">
    <div class="modal-box">
      <div class="modal-title">⚠️ ATENÇÃO VISITANTE</div>
      <div class="modal-desc">
        Ao entrar como visitante, seu progresso, nível e estatísticas <strong>não serão salvos</strong> permanentemente. Se você quiser manter seus dados, crie uma conta com e-mail ou Google.
      </div>
      <div class="actions-grid">
        <button class="btn btn-secondary" onclick="closeGuestModal()">Colocar E-mail</button>
        <button class="btn btn-primary" onclick="confirmGuest()">Entrar Mesmo Assim</button>
      </div>
    </div>
  </div>

<script src="drawstop-supabase.js?v=8"></script>
<script>
  // Se já estiver logado, vai direto pro menu
  window.addEventListener('DOMContentLoaded', async () => {
    const session = await dsGetSession();
    if (session) {
      window.location.href = 'drawstop-menu.html';
    }
  });

  function setFeedback(msg, type) {
    const el = document.getElementById('feedback');
    el.innerText = msg;
    el.className = 'feedback-msg ' + (type || '');
  }

  function setButtonsDisabled(disabled) {
    document.getElementById('btnEntrar').disabled = disabled;
    document.getElementById('btnCriar').disabled = disabled;
    document.getElementById('btnGoogle').disabled = disabled;
  }

  async function handleEmailLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passInput').value;

    if (!email || !password) {
      setFeedback('Preencha e-mail e senha!', 'error');
      return;
    }

    setButtonsDisabled(true);
    setFeedback('Entrando...', '');

    const { error } = await dsClient.auth.signInWithPassword({ email, password });

    setButtonsDisabled(false);

    if (error) {
      setFeedback('❌ ' + traduzErro(error.message), 'error');
      return;
    }

    await dsSetStatus('online');
    checkIfAdminAndRedirect(email);
  }

  async function handleEmailSignup() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passInput').value;

    if (!email || !password) {
      setFeedback('Preencha e-mail e senha!', 'error');
      return;
    }
    if (password.length < 6) {
      setFeedback('A senha precisa ter no mínimo 6 caracteres!', 'error');
      return;
    }

    setButtonsDisabled(true);
    setFeedback('Criando conta...', '');

    const { error } = await dsClient.auth.signUp({
      email,
      password,
      options: { data: { name: email.split('@')[0] } }
    });

    setButtonsDisabled(false);

    if (error) {
      setFeedback('❌ ' + traduzErro(error.message), 'error');
      return;
    }

    setFeedback('✅ Conta criada! Entrando...', 'success');
    await dsSetStatus('online');
    checkIfAdminAndRedirect(email);
  }

  async function handleGoogleLogin() {
  await dsClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: new URL(
        'drawstop-menu.html',
        window.location.href
      ).href
    }
  });
}

  function openGuestModal() { document.getElementById('guestModal').classList.add('active'); }
  function closeGuestModal() { document.getElementById('guestModal').classList.remove('active'); }

  async function confirmGuest() {
    setButtonsDisabled(true);
    const guestName = 'Visitante_' + Math.floor(100 + Math.random() * 900);

    const { error } = await dsClient.auth.signInAnonymously({
      options: { data: { name: guestName } }
    });

    setButtonsDisabled(false);

    if (error) {
      setFeedback('❌ ' + traduzErro(error.message), 'error');
      closeGuestModal();
      return;
    }

    await dsSetStatus('online');
    window.location.href = 'drawstop-menu.html';
  }

  async function checkIfAdminAndRedirect(email) {
    if (email && email.toLowerCase() === 'srichellyel@gmail.com') {
      document.getElementById('admModalPlaceholder');
      showAdmWelcome();
      return;
    }
    window.location.href = 'drawstop-menu.html';
  }

  function showAdmWelcome() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay active';
    overlay.innerHTML = `
      <div class="modal-box" style="border-color: var(--mustard);">
        <div class="modal-title" style="color: var(--mustard);">👑 BEM-VINDO, ADM!</div>
        <div class="modal-desc">
          Login de Administrador Supremo reconhecido. O efeito de moldura dourada e as permissões do painel de controle foram ativadas!
        </div>
        <button class="btn btn-primary" onclick="window.location.href='drawstop-menu.html'">Acessar Menu ADM</button>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  function traduzErro(msg) {
    const traducoes = {
      'Invalid login credentials': 'E-mail ou senha incorretos.',
      'User already registered': 'Este e-mail já está cadastrado. Tente entrar.',
      'Email not confirmed': 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).',
      'Password should be at least 6 characters': 'A senha precisa ter no mínimo 6 caracteres.'
    };
    return traducoes[msg] || msg;
  }
</script>
</body>
</html>
