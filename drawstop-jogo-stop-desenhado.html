<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Stop Desenhado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --paper:#EDE4D2; --paper-2:#E3D6BC; --ink:#1F3A5C; --brick:#B23B2E; --mustard:#D9A404; --charcoal:#2B2620; --cream:#FAF6EC; --green:#3E8E5A; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--charcoal); background:var(--paper); }
  body { display:flex; flex-direction:column; align-items:center; padding:12px 12px 40px; }
  .container { width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; }
  .btn-back { background:var(--cream); border:2.5px solid var(--charcoal); border-radius:12px; padding:6px 14px; font-weight:700; text-decoration:none; color:var(--charcoal); box-shadow:3px 3px 0px var(--charcoal); font-size:13px; cursor:pointer; }
  .timer-box { font-family:'Bebas Neue',sans-serif; font-size:26px; background:var(--brick); color:#FFF; padding:4px 16px; border-radius:10px; border:2px solid var(--charcoal); }
  .letter-display { text-align:center; font-family:'Bebas Neue',sans-serif; font-size:60px; background:var(--mustard); border:3px solid var(--charcoal); border-radius:16px; padding:6px; box-shadow:4px 6px 0px var(--charcoal); overflow:hidden; height:80px; display:flex; align-items:center; justify-content:center; }
  .letter-display.spinning .letter-spin-track { animation: spinLetters 1.6s cubic-bezier(.15,.85,.35,1) forwards; }
  .letter-spin-track { display:flex; flex-direction:column; }
  .letter-spin-track span { height:80px; display:flex; align-items:center; justify-content:center; }
  @keyframes spinLetters { from { transform:translateY(0); } to { transform:translateY(var(--spin-offset)); } }
  .roulette-label { text-align:center; font-size:13px; font-weight:800; color:var(--ink); opacity:.8; }

  .categories-scroller { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .category-canvas-card { flex:0 0 auto; width:150px; background:var(--cream); border:2.5px solid var(--charcoal); border-radius:14px; padding:8px; box-shadow:3px 4px 0px var(--charcoal); }
  .category-canvas-title { font-weight:800; font-size:12px; text-align:center; margin-bottom:6px; }
  .mini-canvas-wrap { background:#FFF; border:2px solid var(--charcoal); border-radius:8px; overflow:hidden; touch-action:none; }
  .mini-canvas { width:100%; height:110px; display:block; touch-action:none; cursor:crosshair; }
  .mini-clear-btn { width:100%; margin-top:4px; padding:4px; font-size:10px; font-weight:800; background:var(--paper-2); border:1.5px solid var(--charcoal); border-radius:6px; cursor:pointer; }

  .tools-row { display:flex; gap:8px; align-items:center; justify-content:center; background:var(--cream); border:2.5px solid var(--charcoal); border-radius:14px; padding:8px; }
  .color-swatch { width:24px; height:24px; border-radius:50%; border:2px solid var(--charcoal); cursor:pointer; }
  .color-swatch.selected { outline:2px solid var(--ink); outline-offset:2px; }
  .brush-slider { width:70px; }

  .btn-stop { width:100%; padding:16px; background:var(--brick); color:#FFF; border:3px solid var(--charcoal); border-radius:16px; font-weight:800; font-size:18px; cursor:pointer; box-shadow:3px 5px 0px var(--charcoal); text-transform:uppercase; }
  .btn-stop:disabled { opacity:.5; }

  .vote-section { display:flex; flex-direction:column; gap:10px; background:var(--cream); border:3px solid var(--charcoal); border-radius:20px; box-shadow:4px 6px 0px var(--charcoal); padding:16px; }
  .vote-player-block { border:2px solid var(--charcoal); border-radius:14px; padding:10px; background:var(--paper-2); }
  .vote-player-name { font-weight:800; font-size:13px; margin-bottom:6px; }
  .vote-answer-row { display:flex; flex-direction:column; gap:6px; background:#FFF; border:1.5px solid var(--charcoal); border-radius:10px; padding:8px; margin-bottom:6px; }
  .vote-drawing-img { width:100%; max-width:200px; border:1px solid #ccc; border-radius:6px; background:#FFF; align-self:center; }
  .vote-btns { display:flex; gap:4px; justify-content:center; }
  .vote-btn { border:2px solid var(--charcoal); border-radius:8px; padding:4px 10px; font-weight:800; font-size:12px; cursor:pointer; }
  .vote-btn.valid { background:var(--green); color:#FFF; }
  .vote-btn.invalid { background:var(--brick); color:#FFF; }
  .vote-btn.selected { outline:2px solid var(--ink); }
  .btn-next-round { width:100%; padding:14px; background:var(--green); color:#FFF; border:3px solid var(--charcoal); border-radius:16px; font-weight:800; cursor:pointer; box-shadow:3px 5px 0px var(--charcoal); }

  .score-strip { display:flex; gap:6px; overflow-x:auto; }
  .score-chip { background:var(--paper-2); border:2px solid var(--charcoal); border-radius:20px; padding:4px 10px; font-size:11px; font-weight:800; white-space:nowrap; }
</style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <button class="btn-back" onclick="leaveGame()">⬅ Sair</button>
      <div class="timer-box" id="timer">60</div>
    </div>

    <div class="score-strip" id="scoreStrip"></div>

    <div class="roulette-label" id="rouletteLabel" style="display:none;">🎡 Sorteando a letra...</div>
    <div class="letter-display" id="letterDisplay">-</div>

    <div id="answerBox">
      <div class="tools-row">
        <div class="color-swatch selected" style="background:#000;" onclick="setColor('#000000', this)"></div>
        <div class="color-swatch" style="background:#B23B2E;" onclick="setColor('#B23B2E', this)"></div>
        <div class="color-swatch" style="background:#D9A404;" onclick="setColor('#D9A404', this)"></div>
        <div class="color-swatch" style="background:#3E8E5A;" onclick="setColor('#3E8E5A', this)"></div>
        <div class="color-swatch" style="background:#1F3A5C;" onclick="setColor('#1F3A5C', this)"></div>
        <input type="range" class="brush-slider" id="brushSize" min="1" max="10" value="3">
      </div>

      <div class="categories-scroller" id="categoriesScroller"></div>

      <button class="btn-stop" id="btnStop" onclick="pressStop()">🛑 STOP!</button>
    </div>

    <div class="vote-section" id="voteBox" style="display:none;">
      <h3 style="margin:0; font-family:'Bebas Neue',sans-serif; font-size:22px;">🗳️ Votação dos desenhos</h3>
      <div id="votePlayersList"></div>
      <button class="btn-next-round" id="btnNextRound" onclick="nextRound()" style="display:none;">➡️ Próxima Rodada</button>
    </div>
  </div>

<script src="drawstop-supabase.js?v=9"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  let myProfile = null;
  let room = null;
  let currentRound = null;
  let timerInterval = null;
  let hasSubmitted = false;
  let currentColor = '#000000';

  let CATEGORIES = ['Animal','Objeto','Comida','Profissão','Lugar'];
  const miniCanvases = {}; // { categoria: { canvas, ctx, drawing, lastX, lastY } }

  function setColor(c, el) {
    currentColor = c;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
  }

  function renderCategoriesCanvases() {
    const scroller = document.getElementById('categoriesScroller');
    scroller.innerHTML = CATEGORIES.map(cat => `
      <div class="category-canvas-card">
        <div class="category-canvas-title">${cat} (${currentRound?.letter || '?'})</div>
        <div class="mini-canvas-wrap">
          <canvas class="mini-canvas" id="canvas-${cat}" width="280" height="220"></canvas>
        </div>
        <button class="mini-clear-btn" onclick="clearMiniCanvas('${cat}')">🗑️ Limpar</button>
      </div>
    `).join('');

    CATEGORIES.forEach(cat => setupMiniCanvas(cat));
  }

  function setupMiniCanvas(cat) {
    const canvas = document.getElementById(`canvas-${cat}`);
    const ctx = canvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    miniCanvases[cat] = { canvas, ctx, drawing: false, lastX: 0, lastY: 0 };

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function start(e) {
      const m = miniCanvases[cat];
      m.drawing = true;
      const pos = getPos(e);
      m.lastX = pos.x; m.lastY = pos.y;
    }
    function move(e) {
      const m = miniCanvases[cat];
      if (!m.drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = document.getElementById('brushSize').value;
      ctx.beginPath();
      ctx.moveTo(m.lastX, m.lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      m.lastX = pos.x; m.lastY = pos.y;
    }
    function end() { miniCanvases[cat].drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', end);
  }

  function clearMiniCanvas(cat) {
    const m = miniCanvases[cat];
    m.ctx.clearRect(0, 0, m.canvas.width, m.canvas.height);
  }

  async function pressStop() {
    if (hasSubmitted) return;
    hasSubmitted = true;
    document.getElementById('btnStop').disabled = true;

    for (const cat of CATEGORIES) {
      const m = miniCanvases[cat];
      if (!m) continue;
      const dataUrl = m.canvas.toDataURL('image/png');
      // Só salva se o jogador realmente desenhou algo (canvas não vazio)
      const isBlank = isCanvasBlank(m.canvas);
      if (!isBlank) {
        await dsClient.from('stop_answers').upsert({
          round_id: currentRound.id, player_id: myProfile.id, category: cat, answer: dataUrl
        }, { onConflict: 'round_id,player_id,category' });
      }
    }

    await dsClient.from('rounds').update({ ended_at: new Date().toISOString() }).eq('id', currentRound.id);
  }

  function isCanvasBlank(canvas) {
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    for (let i = 3; i < data.length; i += 4) {
      if (data[i] !== 0) return false;
    }
    return true;
  }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    let t = seconds;
    document.getElementById('timer').innerText = t;
    timerInterval = setInterval(async () => {
      t--;
      document.getElementById('timer').innerText = Math.max(t, 0);
      if (t <= 0) {
        clearInterval(timerInterval);
        if (!hasSubmitted) await pressStop();
      }
    }, 1000);
  }

  async function loadRoomAndScores() {
    const { data: r } = await dsClient.from('rooms').select('*').eq('id', roomId).single();
    room = r;

    if (room.theme_mode === 'custom' && room.custom_categories && room.custom_categories.length > 0) {
      CATEGORIES = room.custom_categories;
    }

    const { data: players } = await dsClient.from('room_players').select('*, profile:player_id(*)').eq('room_id', roomId);
    document.getElementById('scoreStrip').innerHTML = (players || []).map(p => `
      <div class="score-chip">${p.profile.avatar_emoji || '🎨'} ${p.profile.display_name} · ${p.score || 0}pts</div>
    `).join('');
    return players || [];
  }

  async function startRoundIfHost() {
    if (room.host_id !== myProfile.id) return;
    const { data: existingRound } = await dsClient.from('rounds').select('*').eq('room_id', roomId).eq('round_number', room.current_round).maybeSingle();
    if (existingRound) return;

    const letters = room.letters && room.letters.length > 0 ? room.letters : ['A','B','C','D','E'];
    const letter = letters[Math.floor(Math.random() * letters.length)];
    await dsClient.from('rounds').insert({ room_id: roomId, round_number: room.current_round, letter });
  }

  function spinRoulette(finalLetter) {
    return new Promise(resolve => {
      const display = document.getElementById('letterDisplay');
      const label = document.getElementById('rouletteLabel');
      label.style.display = 'block';

      const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const sequence = [];
      for (let i = 0; i < 18; i++) sequence.push(ALPHABET[Math.floor(Math.random() * ALPHABET.length)]);
      sequence.push(finalLetter);

      const track = document.createElement('div');
      track.className = 'letter-spin-track';
      track.innerHTML = sequence.map(l => `<span>${l}</span>`).join('');
      display.innerHTML = '';
      display.appendChild(track);
      display.classList.remove('spinning');
      track.style.setProperty('--spin-offset', `-${(sequence.length - 1) * 80}px`);

      void display.offsetWidth;
      display.classList.add('spinning');

      setTimeout(() => {
        display.innerHTML = finalLetter;
        label.style.display = 'none';
        resolve();
      }, 1650);
    });
  }

  async function refreshRound() {
    let { data: r } = await dsClient.from('rounds').select('*').eq('room_id', roomId).eq('round_number', room.current_round).maybeSingle();

    if (!r) {
      for (let tentativa = 0; tentativa < 8 && !r; tentativa++) {
        await new Promise(res => setTimeout(res, 400));
        const retry = await dsClient.from('rounds').select('*').eq('room_id', roomId).eq('round_number', room.current_round).maybeSingle();
        r = retry.data;
      }
    }

    currentRound = r;
    if (!currentRound) return;

    hasSubmitted = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('answerBox').style.display = 'block';
    document.getElementById('voteBox').style.display = 'none';
    renderCategoriesCanvases();

    await spinRoulette(currentRound.letter);

    document.getElementById('btnStop').disabled = false;
    startTimer(room.round_time || 90);
  }

  async function showVoting() {
    clearInterval(timerInterval);
    document.getElementById('answerBox').style.display = 'none';
    document.getElementById('voteBox').style.display = 'flex';

    const { data: players } = await dsClient.from('room_players').select('*, profile:player_id(*)').eq('room_id', roomId);
    const { data: answers } = await dsClient.from('stop_answers').select('*').eq('round_id', currentRound.id);
    const { data: votes } = await dsClient.from('stop_votes').select('*');

    const list = document.getElementById('votePlayersList');
    list.innerHTML = (players || []).map(p => {
      const playerAnswers = (answers || []).filter(a => a.player_id === p.player_id);
      if (playerAnswers.length === 0) return '';
      return `
        <div class="vote-player-block">
          <div class="vote-player-name">${p.profile.avatar_emoji || '🎨'} ${p.profile.display_name}</div>
          ${playerAnswers.map(a => {
            const myVote = (votes || []).find(v => v.answer_id === a.id && v.voter_id === myProfile.id);
            return `
              <div class="vote-answer-row">
                <b>${a.category}:</b>
                <img class="vote-drawing-img" src="${a.answer}" alt="Desenho de ${a.category}">
                <div class="vote-btns">
                  <button class="vote-btn valid ${myVote && myVote.is_valid ? 'selected' : ''}" onclick="castVote('${a.id}', true)">✓ Vale</button>
                  <button class="vote-btn invalid ${myVote && !myVote.is_valid ? 'selected' : ''}" onclick="castVote('${a.id}', false)">✗ Não</button>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }).join('');

    if (room.host_id === myProfile.id) document.getElementById('btnNextRound').style.display = 'block';
  }

  async function castVote(answerId, isValid) {
    await dsClient.from('stop_votes').upsert({ answer_id: answerId, voter_id: myProfile.id, is_valid: isValid }, { onConflict: 'answer_id,voter_id' });
    showVoting();
  }

  async function nextRound() {
    const { data: answers } = await dsClient.from('stop_answers').select('*').eq('round_id', currentRound.id);
    const { data: votes } = await dsClient.from('stop_votes').select('*');

    for (const a of (answers || [])) {
      const answerVotes = (votes || []).filter(v => v.answer_id === a.id);
      const validCount = answerVotes.filter(v => v.is_valid).length;
      const invalidCount = answerVotes.filter(v => !v.is_valid).length;
      if (validCount >= invalidCount) {
        const { data: p } = await dsClient.from('room_players').select('score').eq('room_id', roomId).eq('player_id', a.player_id).single();
        await dsClient.from('room_players').update({ score: (p?.score || 0) + 10 }).eq('room_id', roomId).eq('player_id', a.player_id);
      }
    }

    if (room.points_goal) {
      const { data: allPlayers } = await dsClient.from('room_players').select('score').eq('room_id', roomId);
      if ((allPlayers || []).some(p => p.score >= room.points_goal)) {
        await dsClient.from('rooms').update({ status: 'finished' }).eq('id', roomId);
        alert('Partida encerrada — objetivo de pontos atingido! 🎉');
        window.location.href = 'drawstop-menu.html';
        return;
      }
    }

    const nextRoundNum = room.current_round + 1;
    if (nextRoundNum > room.num_rounds) {
      await dsClient.from('rooms').update({ status: 'finished' }).eq('id', roomId);
      alert('Partida encerrada! Obrigado por jogar 🎨🛑');
      window.location.href = 'drawstop-menu.html';
      return;
    }
    await dsClient.from('rooms').update({ current_round: nextRoundNum }).eq('id', roomId);
  }

  async function leaveGame() {
    await dsClient.from('room_players').delete().eq('room_id', roomId).eq('player_id', myProfile.id);
    await dsSetStatus('online');
    window.location.href = 'drawstop-menu.html';
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const session = await dsRequireAuth();
    if (!session) return;
    myProfile = await dsGetProfile();
    if (myProfile.settings && myProfile.settings.ambient_music !== false) {
      dsPlayAmbientMusic((myProfile.settings.bgm ?? 80) / 100);
    }

    await loadRoomAndScores();
    await startRoundIfHost();
    await refreshRound();

    dsClient.channel('stopdesenhado-round-' + roomId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rounds' }, (payload) => {
        if (payload.new.ended_at && currentRound && payload.new.id === currentRound.id) showVoting();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stop_votes' }, () => {
        if (document.getElementById('voteBox').style.display !== 'none') showVoting();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, async (payload) => {
        room = payload.new;
        if (room.status === 'finished') { window.location.href = 'drawstop-menu.html'; return; }
        await loadRoomAndScores();
        await startRoundIfHost();
        await refreshRound();
      })
      .subscribe();
  });
</script>
</body>
</html>
