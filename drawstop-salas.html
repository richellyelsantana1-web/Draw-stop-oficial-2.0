<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Buscar Sala</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --paper:#EDE4D2; --paper-2:#E3D6BC; --ink:#1F3A5C; --brick:#B23B2E; --mustard:#D9A404; --charcoal:#2B2620; --cream:#FAF6EC; --green:#3E8E5A; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--charcoal); background:var(--paper); }
  body { display:flex; flex-direction:column; align-items:center; padding:15px 12px 50px; }
  .container { width:100%; max-width:500px; display:flex; flex-direction:column; gap:16px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; }
  .btn-back { background:var(--cream); border:2.5px solid var(--charcoal); border-radius:12px; padding:6px 14px; font-weight:700; text-decoration:none; color:var(--charcoal); box-shadow:3px 3px 0px var(--charcoal); font-size:13px; }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:32px; text-align:center; margin:0; }
  .room-card { background:var(--cream); border:2.5px solid var(--charcoal); border-radius:16px; box-shadow:3px 4px 0px var(--charcoal); padding:14px; display:flex; justify-content:space-between; align-items:center; }
  .room-name { font-weight:800; font-size:15px; }
  .room-meta { font-size:12px; color:var(--ink); font-weight:600; }
  .mode-tag { font-size:10px; font-weight:900; padding:2px 8px; border-radius:8px; background:var(--paper-2); display:inline-block; margin-top:4px; }
  .btn-join { padding:8px 14px; background:var(--green); color:#FFF; border:2px solid var(--charcoal); border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; }
  .btn-refresh { padding:8px 14px; background:var(--mustard); border:2px solid var(--charcoal); border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; }
  .empty-msg { text-align:center; font-size:13px; font-weight:700; opacity:.7; padding:20px 0; }
  .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.6); display:none; justify-content:center; align-items:center; z-index:1000; padding:20px; }
  .modal-overlay.active { display:flex; }
  .modal-box { background:var(--cream); border:3px solid var(--charcoal); border-radius:14px; padding:22px; max-width:340px; width:100%; text-align:center; }
  .input-field { width:100%; padding:10px; border:2px solid var(--charcoal); border-radius:8px; font-weight:700; margin:12px 0; box-sizing:border-box; }
  .btn-primary { width:100%; padding:10px; background:var(--mustard); border:2px solid var(--charcoal); border-radius:8px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="drawstop-menu.html" class="btn-back">⬅ Voltar</a>
      <h1 class="header-title">BUSCAR SALA</h1>
      <button class="btn-refresh" onclick="loadRooms()">🔄</button>
    </div>

    <div style="display:flex; gap:8px;">
      <input type="text" id="codeSearchInput" class="input-field" placeholder="Código da sala (ex: SALA-1234)" style="margin:0; text-transform:uppercase;">
      <button class="btn-join" style="padding:0 16px;" onclick="searchByCode()">Buscar</button>
    </div>
    <div id="codeSearchResult"></div>

    <h3 style="margin:6px 0 0;">Salas abertas</h3>
    <div id="roomsList"><div class="empty-msg">Carregando salas...</div></div>
  </div>

  <div class="modal-overlay" id="passModal">
    <div class="modal-box">
      <h3>🔒 Sala privada</h3>
      <p style="font-size:13px;">Digite a senha para entrar.</p>
      <input type="password" id="passInput" class="input-field" placeholder="Senha">
      <button class="btn-primary" onclick="confirmJoinPrivate()">Entrar</button>
    </div>
  </div>

<script src="drawstop-supabase.js?v=9"></script>
<script>
  let myProfile = null;
  let pendingRoomId = null;
  const MODE_LABELS = { gartic: '✏️ Draw', stop: '🛑 Stop', stop_desenhado: '🎨 Stop Desenhado' };

  async function searchByCode() {
    const code = document.getElementById('codeSearchInput').value.trim().toUpperCase();
    const resultBox = document.getElementById('codeSearchResult');
    if (!code) { resultBox.innerHTML = ''; return; }

    const { data: room } = await dsClient
      .from('rooms')
      .select('*, host:host_id(display_name), room_players(count)')
      .eq('room_code', code)
      .maybeSingle();

    if (!room) {
      resultBox.innerHTML = '<div class="empty-msg">Nenhuma sala encontrada com esse código.</div>';
      return;
    }
    if (room.status !== 'lobby') {
      resultBox.innerHTML = '<div class="empty-msg">Essa sala já começou ou terminou a partida.</div>';
      return;
    }

    resultBox.innerHTML = `
      <div class="room-card" style="margin-bottom:10px; border-color:var(--green);">
        <div>
          <div class="room-name">${room.privacy === 'private' ? '🔒 ' : ''}${room.name}</div>
          <div class="room-meta">Anfitrião: ${room.host?.display_name || '—'} · ${room.room_players[0]?.count || 0}/${room.max_players} jogadores</div>
          <span class="mode-tag">${MODE_LABELS[room.mode] || room.mode}</span>
        </div>
        <button class="btn-join" onclick="joinRoom('${room.id}', '${room.privacy}')">Entrar</button>
      </div>`;
  }

  async function loadRooms() {
    document.getElementById('roomsList').innerHTML = '<div class="empty-msg">Carregando salas...</div>';

    const { data: rooms, error } = await dsClient
      .from('rooms')
      .select('*, host:host_id(display_name), room_players(count)')
      .eq('status', 'lobby')
      .order('created_at', { ascending: false });

    const list = document.getElementById('roomsList');

    if (error) {
      list.innerHTML = '<div class="empty-msg">Erro ao carregar salas.</div>';
      return;
    }

    if (!rooms || rooms.length === 0) {
      list.innerHTML = '<div class="empty-msg">Nenhuma sala aberta no momento. Que tal criar a sua?</div>';
      return;
    }

    list.innerHTML = rooms.map(r => `
      <div class="room-card" style="margin-bottom:10px;">
        <div>
          <div class="room-name">${r.privacy === 'private' ? '🔒 ' : ''}${r.name}</div>
          <div class="room-meta">Anfitrião: ${r.host?.display_name || '—'} · ${r.room_players[0]?.count || 0}/${r.max_players} jogadores</div>
          <span class="mode-tag">${MODE_LABELS[r.mode] || r.mode}</span>
        </div>
        <button class="btn-join" onclick="joinRoom('${r.id}', '${r.privacy}')">Entrar</button>
      </div>
    `).join('');
  }

  async function joinRoom(roomId, privacy) {
    if (privacy === 'private') {
      pendingRoomId = roomId;
      document.getElementById('passModal').classList.add('active');
      return;
    }
    await doJoin(roomId);
  }

  async function confirmJoinPrivate() {
    const pass = document.getElementById('passInput').value;
    const { data: valid } = await dsClient.rpc('check_room_password', { room_id_input: pendingRoomId, password_input: pass });
    if (!valid) {
      alert('Senha incorreta!');
      return;
    }
    document.getElementById('passModal').classList.remove('active');
    await doJoin(pendingRoomId);
  }

  async function doJoin(roomId) {
    const { error } = await dsClient.from('room_players').insert({ room_id: roomId, player_id: myProfile.id });
    if (error && !error.message.includes('duplicate')) {
      alert('Não foi possível entrar: ' + error.message);
      return;
    }
    await dsSetStatus('ingame');
    window.location.href = `drawstop-lobby.html?room=${roomId}`;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const session = await dsRequireAuth();
    if (!session) return;
    myProfile = await dsGetProfile();
    loadRooms();
  });
</script>
</body>
</html>
