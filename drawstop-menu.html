<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper: #EDE4D2; --paper-2: #E3D6BC; --paper-deep: #D8C8A6;
    --ink: #1F3A5C; --ink-light: #345480; --brick: #B23B2E;
    --mustard: #D9A404; --charcoal: #2B2620; --cream: #FAF6EC; --green: #3E8E5A;
  }
  body.dark-mode {
    --paper: #1A1A1A; --paper-2: #2A2A2A; --paper-deep: #333333;
    --ink: #8FAEFF; --ink-light: #B0C4DE; --charcoal: #F0F0F0; --cream: #242424;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; min-height:100vh; font-family:'Poppins', sans-serif;
    color: var(--charcoal); background: var(--paper); overflow-x:hidden; transition: background .3s,color .3s;
  }
  body { display:flex; flex-direction:column; align-items:center; padding:15px 12px 50px; position:relative; }
  body::before {
    content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background-image: linear-gradient(90deg, transparent 79px, #ab4747 79px, #ab4747 81px, transparent 81px),
      linear-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size: 100% 100%, 100% 28px; opacity:.35; z-index:-2; pointer-events:none;
  }
  .container { width:100%; max-width:480px; display:flex; flex-direction:column; gap:16px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; width:100%; }
  .logo-mini { font-family:'Bebas Neue', sans-serif; font-size:28px; color:var(--brick); }

  .profile-chip {
    display:flex; align-items:center; gap:8px; background:var(--cream);
    border:2.5px solid var(--charcoal); border-radius:30px; padding:5px 12px 5px 5px;
    cursor:pointer; box-shadow:2px 3px 0px var(--charcoal); position:relative;
  }
  .profile-avatar {
    width:32px; height:32px; border-radius:50%; background:#FFF;
    border:2px solid var(--charcoal); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .profile-avatar.admin { border-color: var(--mustard); box-shadow:0 0 8px var(--mustard); }
  .profile-name { font-weight:800; font-size:13px; }
  .adm-tag {
    font-size:9px; font-weight:900; background:linear-gradient(90deg,#F0BC2E,#D9A404);
    color:#3a2b00; padding:1px 6px; border-radius:6px; margin-left:2px; letter-spacing:.5px;
  }

  .card-box {
    background:var(--cream); border:3px solid var(--charcoal); border-radius:20px;
    box-shadow:4px 6px 0px var(--charcoal); padding:18px; display:flex; flex-direction:column; gap:14px;
  }

  .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .menu-btn {
    background:var(--paper-2); border:2.5px solid var(--charcoal); border-radius:16px;
    padding:20px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;
    font-weight:800; font-size:14px; cursor:pointer; box-shadow:3px 4px 0px var(--charcoal);
    text-decoration:none; color:var(--charcoal);
  }
  .menu-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0px var(--charcoal); }
  .menu-btn .icon { font-size:32px; }
  .menu-btn.primary { background:var(--mustard); }
  .menu-btn.admin { background:linear-gradient(135deg,#F0BC2E,#D9A404); grid-column: span 2; }

  .empty-msg { text-align:center; font-size:13px; font-weight:700; opacity:.7; padding:15px 0; }

  .bell-btn { position:relative; background:var(--cream); border:2.5px solid var(--charcoal); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; box-shadow:2px 3px 0px var(--charcoal); }
  .bell-badge { position:absolute; top:-6px; right:-6px; background:var(--brick); color:#FFF; font-size:10px; font-weight:900; border-radius:50%; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; border:2px solid var(--charcoal); }
  .notif-panel { position:fixed; top:0; right:0; width:100%; max-width:340px; height:100%; background:var(--cream); border-left:3px solid var(--charcoal); z-index:2000; transform:translateX(100%); transition:transform .25s; padding:16px; overflow-y:auto; }
  .notif-panel.open { transform:translateX(0); }
  .notif-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1999; display:none; }
  .notif-overlay.open { display:block; }
  .notif-item { background:var(--paper-2); border:2px solid var(--charcoal); border-radius:12px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .notif-item.unread { border-color:var(--mustard); }
  .notif-title { font-weight:800; font-size:13px; }
  .notif-body { font-size:11px; opacity:.8; }

  .announce-banner { border-radius:14px; border:2.5px solid var(--charcoal); padding:10px 14px; font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px; }
  .announce-info { background:var(--ink); color:#fff; }
  .announce-warning { background:var(--mustard); color:#000; }
  .announce-maintenance { background:var(--brick); color:#fff; }
  .announce-event { background:var(--green); color:#fff; }

  .modal-suggestion { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--cream); border:4px solid var(--charcoal); border-radius:20px; padding:24px; width:90%; max-width:420px; z-index:3000; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .sugg-section { font-size:13px; margin-bottom:6px; }
  .sugg-response-box { background:var(--paper-2); border:2px solid var(--charcoal); border-radius:12px; padding:14px; font-size:13px; text-align:center; margin:10px 0; }
  .btn-primary-sugg { width:100%; padding:12px; background:var(--mustard); border:2.5px solid var(--charcoal); border-radius:12px; font-weight:800; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="logo-mini">DrawStop</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="bell-btn" onclick="toggleNotifPanel()">
          🔔
          <div class="bell-badge" id="bellBadge" style="display:none;">0</div>
        </div>
        <div class="profile-chip" onclick="window.location.href='drawstop-perfil.html'">
          <div class="profile-avatar" id="chipAvatar">🎨</div>
          <div>
            <div class="profile-name" id="chipName">Carregando...</div>
          </div>
        </div>
      </div>
    </div>

    <div id="announceBanners"></div>

    <div class="card-box">
      <div class="menu-grid">
        <a href="drawstop-criar-sala.html" class="menu-btn primary">
          <div class="icon">🎲</div> Criar Sala
        </a>
        <a href="drawstop-salas.html" class="menu-btn">
          <div class="icon">🔍</div> Buscar Sala
        </a>
        <a href="drawstop-amigos.html" class="menu-btn">
          <div class="icon">👥</div> Amigos
        </a>
        <a href="drawstop-configuracoes.html" class="menu-btn">
          <div class="icon">⚙️</div> Configurações
        </a>
        <a href="drawstop-ranking.html" class="menu-btn">
          <div class="icon">🏆</div> Ranking
        </a>
        <a href="drawstop-mega.html" class="menu-btn" id="megaButton" style="display:none; background:linear-gradient(135deg,#00e5ff,#ff00e5); color:#fff;">
          <div class="icon">✨</div> Sugestão MEGA
        </a>
        <a href="drawstop-painel-adm.html" class="menu-btn admin" id="admButton" style="display:none;">
          <div class="icon">👑</div> Painel ADM
        </a>
      </div>
    </div>
  </div>

  <div class="notif-overlay" id="notifOverlay" onclick="toggleNotifPanel()"></div>
  <div class="notif-panel" id="notifPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;">🔔 Notificações</h3>
      <span style="cursor:pointer; font-weight:800;" onclick="toggleNotifPanel()">✕</span>
    </div>
    <button style="width:100%; padding:8px; background:var(--paper-2); border:2px solid var(--charcoal); border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; margin-bottom:10px;" onclick="clearAllNotifications()">🗑️ Limpar todas</button>
    <div id="notifList"><div class="empty-msg">Carregando...</div></div>
  </div>

  <div class="notif-overlay" id="suggestionOverlay" style="display:none;"></div>
  <div class="modal-suggestion" id="suggestionModal" style="display:none;">
    <h2 style="text-align:center; margin:0 0 12px;">📢 Resposta do Administrador!</h2>
    <div class="sugg-section"><b>Categoria:</b> <span id="suggCat"></span> | <b>Palavra:</b> <span id="suggWord"></span></div>
    <div id="suggVerdictBox" style="text-align:center; font-size:26px; font-weight:900; margin:14px 0;"></div>
    <div class="sugg-section" style="text-align:center;">Respondido por: <b>Administrador do Jogo</b></div>
    <div class="sugg-response-box" id="suggResponseText"></div>
    <button class="btn-primary-sugg" onclick="closeSuggestionModal()">Entendido</button>
  </div>

<script src="drawstop-supabase.js?v=9"></script>
<script>
  window.addEventListener('DOMContentLoaded', async () => {
    // Checa a sessão manualmente primeiro (sem redirecionar ainda), com uma segunda tentativa
    // para dar tempo do navegador restaurar a sessão do armazenamento local antes de desistir.
    let session = await dsGetSession();
    if (!session) {
      await new Promise(r => setTimeout(r, 500));
      session = await dsGetSession();
    }
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const profile = await dsGetProfile();
    if (!profile) return;

    document.getElementById('chipAvatar').innerText = profile.avatar_emoji || '🎨';
    let nameHtml = profile.display_name;
    if (dsIsAdminActive(profile) && profile.admin_tag_visible) {
      nameHtml += ` <span class="adm-tag">${profile.admin_tag_label || 'ADM'}</span>`;
    }
    const rankTags = await dsGetLiveRankTags(profile.id);
    rankTags.forEach(t => { nameHtml += ` <span class="adm-tag" style="background:linear-gradient(90deg,#8E44AD,#3E8E5A); color:#fff;">${t.label}</span>`; });
    if (profile.custom_rank_tag) {
      nameHtml += ` <span class="adm-tag" style="background:linear-gradient(90deg,#E91E63,#FF9800); color:#fff;">${profile.custom_rank_tag}</span>`;
    }
    document.getElementById('chipName').innerHTML = nameHtml;

    if (dsIsAdminActive(profile)) {
      document.getElementById('chipAvatar').classList.add('admin');
      document.getElementById('admButton').style.display = 'flex';
    }

    // Aplica modo escuro salvo
    if (localStorage.getItem('drawstop_darkmode') === 'true') {
      document.body.classList.add('dark-mode');
    }

    await dsSetStatus('online');

    if (profile.subscription_tier === 'mega') {
      document.getElementById('megaButton').style.display = 'flex';
    }

    loadNotifications(profile.id);
    loadAnnouncements();
    checkSuggestionResponse(profile.id);
    dsClient.channel('notif-' + profile.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${profile.id}` }, () => loadNotifications(profile.id))
      .subscribe();
  });

  const NOTIF_ICONS = { friend_request:'👥', friend_accepted:'✅', room_invite:'🎲', game_start:'🎮', admin:'👑', ban:'🚫', unban:'🔓' };

  async function loadNotifications(userId) {
    window._dsCurrentUserId = userId;
    const { data: notifs } = await dsClient.from('notifications').select('*').eq('user_id', userId).order('created_at', { ascending:false }).limit(30);
    const unread = (notifs || []).filter(n => !n.is_read).length;

    const badge = document.getElementById('bellBadge');
    badge.style.display = unread > 0 ? 'flex' : 'none';
    badge.innerText = unread;

    const list = document.getElementById('notifList');
    if (!notifs || notifs.length === 0) {
      list.innerHTML = '<div class="empty-msg">Nenhuma notificação ainda.</div>';
      return;
    }
    list.innerHTML = notifs.map(n => `
      <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="openNotif('${n.id}', ${n.link ? `'${n.link}'` : 'null'})">
        <div class="notif-title">${NOTIF_ICONS[n.type] || '🔔'} ${n.title}</div>
        ${n.body ? `<div class="notif-body">${n.body}</div>` : ''}
      </div>
    `).join('');
  }

  async function openNotif(id, link) {
    await dsClient.from('notifications').update({ is_read: true }).eq('id', id);
    if (link) window.location.href = link;
  }

  function toggleNotifPanel() {
    document.getElementById('notifPanel').classList.toggle('open');
    document.getElementById('notifOverlay').classList.toggle('open');
  }

  async function clearAllNotifications() {
    if (!window._dsCurrentUserId) return;
    if (!confirm('Apagar todas as suas notificações?')) return;
    await dsClient.from('notifications').delete().eq('user_id', window._dsCurrentUserId);
    loadNotifications(window._dsCurrentUserId);
  }

  const ANNOUNCE_ICONS = { info: 'ℹ️', warning: '⚠️', maintenance: '🔧', event: '🎉' };
  async function loadAnnouncements() {
    const { data } = await dsClient.from('announcements').select('*').eq('is_active', true).order('created_at', { ascending: false });
    const container = document.getElementById('announceBanners');
    if (!data || data.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = data.map(a => `
      <div class="announce-banner announce-${a.type}">
        <span>${ANNOUNCE_ICONS[a.type] || 'ℹ️'}</span>
        <span>${a.message}</span>
      </div>
    `).join('');
  }

  let _pendingSuggestionId = null;
  async function checkSuggestionResponse(userId) {
    const { data } = await dsClient
      .from('word_suggestions')
      .select('*')
      .eq('player_id', userId)
      .eq('seen_by_player', false)
      .neq('status', 'pending')
      .order('responded_at', { ascending: false })
      .limit(1);

    if (!data || data.length === 0) return;
    const s = data[0];
    _pendingSuggestionId = s.id;

    document.getElementById('suggCat').innerText = s.category;
    document.getElementById('suggWord').innerText = s.word;
    document.getElementById('suggVerdictBox').innerHTML = s.status === 'approved' ? '🟢 APROVADO' : '🔴 RECUSADO';
    document.getElementById('suggVerdictBox').style.color = s.status === 'approved' ? 'var(--green)' : 'var(--brick)';
    document.getElementById('suggResponseText').innerText = s.admin_response || '';

    document.getElementById('suggestionOverlay').style.display = 'block';
    document.getElementById('suggestionModal').style.display = 'block';
  }

  async function closeSuggestionModal() {
    document.getElementById('suggestionOverlay').style.display = 'none';
    document.getElementById('suggestionModal').style.display = 'none';
    if (_pendingSuggestionId) {
      await dsClient.from('word_suggestions').update({ seen_by_player: true }).eq('id', _pendingSuggestionId);
      _pendingSuggestionId = null;
    }
  }
</script>
</body>
</html>
