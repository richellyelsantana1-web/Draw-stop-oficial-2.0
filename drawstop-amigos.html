<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Amigos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper:#EDE4D2; --paper-2:#E3D6BC; --paper-deep:#D8C8A6; --ink:#1F3A5C; --ink-light:#345480;
    --brick:#B23B2E; --mustard:#D9A404; --charcoal:#2B2620; --cream:#FAF6EC; --green:#3E8E5A;
    --pf-font:'Poppins', sans-serif;
  }
  body.dark-mode {
    --paper:#1A1A1A; --paper-2:#2A2A2A; --paper-deep:#333333;
    --ink:#8FAEFF; --ink-light:#B0C4DE; --charcoal:#F0F0F0; --cream:#242424;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100vh; font-family:var(--pf-font); color:var(--charcoal); background:var(--paper); overflow-x:hidden; transition:background .3s,color .3s; }
  body { display:flex; flex-direction:column; align-items:center; padding:15px 12px 50px; position:relative; }
  body::before {
    content:''; position:fixed; top:0; left:0; right:0; bottom:0;
    background-image: linear-gradient(90deg, transparent 79px, #ab4747 79px, #ab4747 81px, transparent 81px),
      linear-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size:100% 100%, 100% 28px; opacity:.35; z-index:-2; pointer-events:none;
  }
  .container { width:100%; max-width:480px; display:flex; flex-direction:column; gap:16px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; width:100%; }
  .btn-back { background:var(--cream); border:2.5px solid var(--charcoal); border-radius:12px; padding:6px 14px; font-weight:700; color:var(--charcoal); text-decoration:none; box-shadow:3px 3px 0px var(--charcoal); font-size:13px; cursor:pointer; }
  .header-title { font-family:'Bebas Neue', sans-serif; font-size:32px; color:var(--charcoal); text-align:center; margin:0; line-height:1; }

  .tabs-nav { display:flex; gap:6px; width:100%; }
  .tab-btn { flex:1; padding:10px 4px; background:var(--paper-2); border:2.5px solid var(--charcoal); border-radius:12px; font-weight:800; font-size:12px; cursor:pointer; box-shadow:2px 3px 0px var(--charcoal); text-align:center; color:var(--charcoal); }
  .tab-btn.active { background:var(--mustard); transform:translateY(2px); box-shadow:1px 1px 0px var(--charcoal); }

  .card-box { background:var(--cream); border:3px solid var(--charcoal); border-radius:20px; box-shadow:4px 6px 0px var(--charcoal); padding:18px; display:flex; flex-direction:column; gap:14px; }

  .my-code-box { display:flex; justify-content:space-between; align-items:center; background:var(--paper-2); border:2px solid var(--charcoal); border-radius:12px; padding:10px 14px; }
  .my-code { font-weight:900; font-size:16px; letter-spacing:1px; }
  .btn-copy { background:var(--mustard); border:2px solid var(--charcoal); border-radius:10px; padding:6px 12px; font-weight:800; font-size:11px; cursor:pointer; }

  .search-group { display:flex; gap:8px; }
  .search-input { flex:1; padding:10px 14px; border:2.5px solid var(--charcoal); border-radius:12px; font-weight:700; font-size:13px; outline:none; background:#FFF; color:#000; }

  .friend-list { display:flex; flex-direction:column; gap:10px; }
  .friend-card { background:var(--paper-2); border:2.5px solid var(--charcoal); border-radius:14px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; box-shadow:2px 3px 0px var(--charcoal); }
  .friend-info { display:flex; align-items:center; gap:12px; }
  .avatar-wrap { position:relative; width:44px; height:44px; border-radius:10px; background:#FFF; border:2px solid var(--charcoal); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; }
  .status-dot { position:absolute; bottom:-2px; right:-2px; width:12px; height:12px; border-radius:50%; border:2px solid var(--charcoal); }
  .status-online { background:var(--green); }
  .status-ingame { background:var(--mustard); }
  .status-offline { background:#888; }
  .friend-details { display:flex; flex-direction:column; }
  .friend-name { font-weight:800; font-size:14px; margin:0; line-height:1.1; }
  .friend-code { font-size:11px; font-weight:700; color:var(--ink-light); }
  .friend-status-text { font-size:11px; font-weight:600; opacity:.8; }
  .action-group { display:flex; gap:6px; align-items:center; }
  .action-btn { padding:6px 10px; border:2px solid var(--charcoal); border-radius:10px; font-weight:800; font-size:11px; cursor:pointer; box-shadow:2px 2px 0px var(--charcoal); text-transform:uppercase; }
  .btn-invite { background:var(--green); color:#FFF; }
  .btn-add { background:var(--mustard); color:#000; }
  .btn-remove { background:var(--brick); color:#FFF; }
  .btn-accept { background:var(--green); color:#FFF; }
  .btn-decline { background:var(--brick); color:#FFF; }
  .empty-msg { text-align:center; font-size:13px; font-weight:700; opacity:.7; padding:15px 0; }
</style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="drawstop-menu.html" class="btn-back">⬅ Voltar</a>
      <h1 class="header-title">AMIGOS</h1>
      <div style="width:70px;"></div>
    </div>

    <div class="my-code-box">
      <span>Seu código: <span class="my-code" id="myCode">...</span></span>
      <button class="btn-copy" onclick="copyMyCode()">Copiar</button>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" id="tabMyFriends" onclick="switchTab('myFriends')">👥 AMIGOS (<span id="friendCount">0</span>)</button>
      <button class="tab-btn" id="tabAdd" onclick="switchTab('add')">🔍 ADICIONAR</button>
      <button class="tab-btn" id="tabRequests" onclick="switchTab('requests')">📩 PENDENTES (<span id="pendingCount">0</span>)</button>
    </div>

    <div class="card-box" id="viewMyFriends">
      <div class="friend-list" id="myFriendsList">
        <div class="empty-msg">Carregando...</div>
      </div>
    </div>

    <div class="card-box" id="viewAdd" style="display:none;">
      <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="Digite o código exato (ex: #DS-1234)...">
        <button class="btn-back" style="background:var(--mustard);" onclick="searchPlayer()">Buscar</button>
      </div>
      <div class="friend-list" id="searchResults">
        <div class="empty-msg">Digite o código do jogador acima para buscar.</div>
      </div>
    </div>

    <div class="card-box" id="viewRequests" style="display:none;">
      <div class="friend-list" id="requestsList">
        <div class="empty-msg">Carregando...</div>
      </div>
    </div>
  </div>

<script src="drawstop-supabase.js?v=9"></script>
<script>
  let myProfile = null;

  function switchTab(tabName) {
    document.getElementById('viewMyFriends').style.display = tabName === 'myFriends' ? 'flex' : 'none';
    document.getElementById('viewAdd').style.display = tabName === 'add' ? 'flex' : 'none';
    document.getElementById('viewRequests').style.display = tabName === 'requests' ? 'flex' : 'none';
    document.getElementById('tabMyFriends').classList.toggle('active', tabName === 'myFriends');
    document.getElementById('tabAdd').classList.toggle('active', tabName === 'add');
    document.getElementById('tabRequests').classList.toggle('active', tabName === 'requests');
  }

  function copyMyCode() {
    navigator.clipboard.writeText(myProfile.friend_code);
    alert('Código copiado: ' + myProfile.friend_code);
  }

  function statusLabel(profile) {
    const status = dsRealStatus(profile);
    if (status === 'online') return { text: 'Online', cls: 'status-online', color: 'var(--green)' };
    if (status === 'ingame') return { text: 'Em partida', cls: 'status-ingame', color: 'var(--mustard)' };
    return { text: 'Offline', cls: 'status-offline', color: '#888' };
  }

  async function loadFriends() {
    const { data: friendships } = await dsClient
      .from('friendships')
      .select('id, requester_id, addressee_id, requester:requester_id(*), addressee:addressee_id(*)')
      .eq('status', 'accepted')
      .or(`requester_id.eq.${myProfile.id},addressee_id.eq.${myProfile.id}`);

    const list = document.getElementById('myFriendsList');
    if (!friendships || friendships.length === 0) {
      list.innerHTML = '<div class="empty-msg">Você ainda não tem amigos. Vá na aba Adicionar!</div>';
      document.getElementById('friendCount').innerText = 0;
      return;
    }

    document.getElementById('friendCount').innerText = friendships.length;

    list.innerHTML = friendships.map(f => {
      const isRequester = f.requester_id === myProfile.id;
      const friend = isRequester ? f.addressee : f.requester;
      const st = statusLabel(friend);
      return `
        <div class="friend-card">
          <div class="friend-info">
            <div class="avatar-wrap">${friend.avatar_emoji || '🎨'}<div class="status-dot ${st.cls}"></div></div>
            <div class="friend-details">
              <div class="friend-name">${friend.display_name}</div>
              <div class="friend-code">${friend.friend_code}</div>
              <div class="friend-status-text" style="color:${st.color};">${st.text}</div>
            </div>
          </div>
          <div class="action-group">
            <button class="action-btn" style="background:var(--ink); color:#FFF;" onclick="window.location.href='drawstop-ver-perfil.html?user='+encodeURIComponent('${isRequester ? f.addressee_id : f.requester_id}')">Perfil</button>
            <button class="action-btn btn-remove" onclick="removeFriend('${f.id}')">Remover</button>
          </div>
        </div>`;
    }).join('');
  }

  async function loadRequests() {
    const { data: requests } = await dsClient
      .from('friendships')
      .select('id, requester:requester_id(*)')
      .eq('status', 'pending')
      .eq('addressee_id', myProfile.id);

    const list = document.getElementById('requestsList');
    document.getElementById('pendingCount').innerText = requests ? requests.length : 0;

    if (!requests || requests.length === 0) {
      list.innerHTML = '<div class="empty-msg">Nenhuma solicitação pendente.</div>';
      return;
    }

    list.innerHTML = requests.map(r => `
      <div class="friend-card">
        <div class="friend-info">
          <div class="avatar-wrap">${r.requester.avatar_emoji || '🎨'}</div>
          <div class="friend-details">
            <div class="friend-name">${r.requester.display_name}</div>
            <div class="friend-code">${r.requester.friend_code}</div>
            <div class="friend-status-text">Te enviou um convite</div>
          </div>
        </div>
        <div class="action-group">
          <button class="action-btn btn-accept" onclick="respondRequest('${r.id}', true)">Aceitar</button>
          <button class="action-btn btn-decline" onclick="respondRequest('${r.id}', false)">Recusar</button>
        </div>
      </div>`).join('');
  }

  async function respondRequest(id, accept) {
    if (accept) {
      const { data: friendship } = await dsClient.from('friendships').select('requester_id').eq('id', id).single();
      await dsClient.from('friendships').update({ status: 'accepted', responded_at: new Date().toISOString() }).eq('id', id);
      if (friendship) {
        await dsSendNotification(friendship.requester_id, 'friend_accepted', `${myProfile.display_name} aceitou seu pedido de amizade!`, null, 'drawstop-amigos.html');
        dsUnlockAchievement(friendship.requester_id, 'first_friend');
        dsUnlockAchievement(myProfile.id, 'first_friend');
      }
    } else {
      await dsClient.from('friendships').delete().eq('id', id);
    }
    loadRequests();
    loadFriends();
  }

  async function removeFriend(id) {
    if (!confirm('Deseja remover este amigo?')) return;
    await dsClient.from('friendships').delete().eq('id', id);
    loadFriends();
  }

  async function searchPlayer() {
    const q = document.getElementById('searchInput').value.trim().toUpperCase();
    const resultsContainer = document.getElementById('searchResults');
    if (!q) { resultsContainer.innerHTML = '<div class="empty-msg">Digite algo para buscar!</div>'; return; }

    const { data: results } = await dsClient
      .from('profiles')
      .select('*')
      .ilike('friend_code', `%${q}%`)
      .neq('id', myProfile.id)
      .limit(10);

    if (!results || results.length === 0) {
      resultsContainer.innerHTML = '<div class="empty-msg">Nenhum jogador encontrado.</div>';
      return;
    }

    resultsContainer.innerHTML = results.map(p => `
      <div class="friend-card">
        <div class="friend-info">
          <div class="avatar-wrap">${p.avatar_emoji || '🎨'}</div>
          <div class="friend-details">
            <div class="friend-name">${p.display_name}</div>
            <div class="friend-code">${p.friend_code}</div>
          </div>
        </div>
        <button class="action-btn btn-add" onclick="sendFriendRequest('${p.id}', this)">Adicionar</button>
      </div>`).join('');
  }

  async function sendFriendRequest(addresseeId, btn) {
    const { error } = await dsClient.from('friendships').insert({
      requester_id: myProfile.id,
      addressee_id: addresseeId
    });
    if (error) {
      alert('Não foi possível enviar: ' + error.message);
      return;
    }
    await dsSendNotification(addresseeId, 'friend_request', `${myProfile.display_name} te enviou um pedido de amizade!`, myProfile.friend_code, 'drawstop-amigos.html');
    btn.innerText = 'Enviado ✓';
    btn.style.background = '#888';
    btn.disabled = true;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const session = await dsRequireAuth();
    if (!session) return;

    myProfile = await dsGetProfile();
    if (localStorage.getItem('drawstop_darkmode') === 'true') document.body.classList.add('dark-mode');

    document.getElementById('myCode').innerText = myProfile.friend_code;
    loadFriends();
    loadRequests();
  });
</script>
</body>
</html>
