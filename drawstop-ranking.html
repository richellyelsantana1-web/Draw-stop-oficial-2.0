<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawStop — Ranking Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --paper:#EDE4D2; --paper-2:#E3D6BC; --ink:#1F3A5C; --brick:#B23B2E; --mustard:#D9A404; --charcoal:#2B2620; --cream:#FAF6EC; --green:#3E8E5A; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; min-height:100vh; font-family:'Poppins',sans-serif; color:var(--charcoal); background:var(--paper); }
  body { display:flex; flex-direction:column; align-items:center; padding:15px 12px 50px; }
  .container { width:100%; max-width:500px; display:flex; flex-direction:column; gap:16px; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; }
  .btn-back { background:var(--cream); border:2.5px solid var(--charcoal); border-radius:12px; padding:6px 14px; font-weight:700; text-decoration:none; color:var(--charcoal); box-shadow:3px 3px 0px var(--charcoal); font-size:13px; cursor:pointer; }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:32px; text-align:center; margin:0; }
  .tabs-nav { display:flex; gap:6px; }
  .tab-btn { flex:1; padding:10px 4px; background:var(--paper-2); border:2.5px solid var(--charcoal); border-radius:12px; font-weight:800; font-size:13px; cursor:pointer; box-shadow:2px 3px 0px var(--charcoal); text-align:center; }
  .tab-btn.active { background:var(--mustard); transform:translateY(2px); box-shadow:1px 1px 0px var(--charcoal); }
  .rank-row { display:flex; align-items:center; gap:10px; background:var(--cream); border:2.5px solid var(--charcoal); border-radius:14px; padding:10px 12px; box-shadow:3px 4px 0px var(--charcoal); }
  .rank-row.top10 { border-color:var(--mustard); background:linear-gradient(90deg, #FFF8E1, var(--cream)); }
  .rank-number { font-family:'Bebas Neue',sans-serif; font-size:22px; width:32px; text-align:center; }
  .rank-row.top10 .rank-number { color:var(--mustard); }
  .rank-avatar { width:36px; height:36px; border-radius:8px; background:#FFF; border:2px solid var(--charcoal); display:flex; align-items:center; justify-content:center; font-size:16px; overflow:hidden; }
  .rank-avatar img { width:100%; height:100%; object-fit:cover; }
  .rank-name { font-weight:800; font-size:14px; flex:1; }
  .rank-score { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--green); }
  .top10-badge { font-size:9px; font-weight:900; background:linear-gradient(90deg,#F0BC2E,#D9A404); color:#3a2b00; padding:1px 6px; border-radius:6px; margin-left:4px; }
  .empty-msg { text-align:center; font-size:13px; font-weight:700; opacity:.7; padding:20px 0; }
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="drawstop-menu.html" class="btn-back">⬅ Voltar</a>
      <h1 class="header-title">🏆 RANKING</h1>
      <div style="width:70px;"></div>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" id="tabGartic" onclick="switchMode('gartic')">✏️ Draw</button>
      <button class="tab-btn" id="tabStop" onclick="switchMode('stop')">🛑 Stop</button>
      <button class="tab-btn" id="tabStopdesenhado" onclick="switchMode('stopdesenhado')">🎨 DrawStop</button>
    </div>

    <div id="rankingList"><div class="empty-msg">Carregando...</div></div>
  </div>

<script src="drawstop-supabase.js?v=9"></script>
<script>
  async function switchMode(mode) {
    document.getElementById('tabGartic').classList.toggle('active', mode === 'gartic');
    document.getElementById('tabStop').classList.toggle('active', mode === 'stop');
    document.getElementById('tabStopdesenhado').classList.toggle('active', mode === 'stopdesenhado');

    const list = document.getElementById('rankingList');
    list.innerHTML = '<div class="empty-msg">Carregando...</div>';

    const { data } = await dsClient.rpc('get_leaderboard', { mode_input: mode, limit_input: 30 });

    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty-msg">Ninguém pontuou nesse modo ainda. Seja o primeiro!</div>';
      return;
    }

    list.innerHTML = data.map((p, i) => {
      const rank = i + 1;
      const isTop10 = rank <= 10;
      const avatarHtml = p.avatar_url ? `<img src="${p.avatar_url}">` : (p.avatar_emoji || '🎨');
      return `
        <div class="rank-row ${isTop10 ? 'top10' : ''}">
          <div class="rank-number">${rank}</div>
          <div class="rank-avatar">${avatarHtml}</div>
          <div class="rank-name">${p.display_name} ${isTop10 ? `<span class="top10-badge">TOP ${rank}</span>` : ''}</div>
          <div class="rank-score">${p.score}</div>
        </div>`;
    }).join('');
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const session = await dsRequireAuth();
    if (!session) return;
    switchMode('gartic');
  });
</script>
</body>
</html>
